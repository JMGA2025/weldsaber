<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WELDSABER | Entrenamiento SMAW</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>html,body{margin:0;height:100%;overflow:hidden;background:#071016}</style>
</head>
<body>
<a-scene id="scene" game-engine renderer="alpha:true;antialias:true;colorManagement:true" webxr="optionalFeatures: local-floor, passthrough" cursor="rayOrigin:mouse" raycaster="objects:.interactuable;far:20">
  <a-light type="ambient" intensity="0.85"></a-light>
  <a-light type="directional" position="2 5 3" intensity="0.9" color="#dbeafe"></a-light>
  <a-grid position="0 0 0" rotation="-90 0 0" width="24" height="40" material="color:#4b7280;opacity:.13;transparent:true"></a-grid>

  <a-entity id="rig">
    <a-camera position="0 1.6 0"></a-camera>
    <a-entity id="leftHand" laser-controls="hand:left" raycaster="objects:.target-item,.interactuable;far:20;showLine:false;interval:10">
      <a-cylinder class="saber-blade" position="0 0 -0.55" rotation="90 0 0" radius=".018" height="1.1" material="color:#f1c40f;emissive:#f1c40f;emissiveIntensity:5"></a-cylinder>
      <a-light type="point" intensity=".8" distance="3" color="#f1c40f"></a-light>
    </a-entity>
    <a-entity id="rightHand" laser-controls="hand:right" raycaster="objects:.target-item,.interactuable;far:20;showLine:false;interval:10">
      <a-cylinder class="saber-blade" position="0 0 -0.55" rotation="90 0 0" radius=".018" height="1.1" material="color:#f1c40f;emissive:#f1c40f;emissiveIntensity:5"></a-cylinder>
      <a-light type="point" intensity=".8" distance="3" color="#f1c40f"></a-light>
    </a-entity>
    <a-entity hand-tracking-controls="hand:left" raycaster="objects:.target-item,.interactuable;far:20;interval:10"></a-entity>
    <a-entity hand-tracking-controls="hand:right" raycaster="objects:.target-item,.interactuable;far:20;interval:10"></a-entity>
  </a-entity>

  <a-entity id="hud" position="0 2.55 -4">
    <a-plane width="6.8" height="3.45" color="#081217" opacity=".96"></a-plane>
    <a-text value="WELDSABER | ENTRENAMIENTO SMAW" align="center" position="0 1.38 .05" width="6.4" color="#f1c40f" font="exo2bold"></a-text>
    <a-text id="level-text" value="NIVEL 1 | SEGURIDAD" align="center" position="0 1.06 .05" width="5" color="#83d5e8"></a-text>
    <a-plane position="0 .82 .05" width="5.4" height=".09" color="#263238"></a-plane>
    <a-plane id="progress-bar" position="-2.7 .82 .07" width="0" height=".09" color="#2ecc71"></a-plane>
    <a-text id="hint-text" value="REVISA EL EQUIPO Y CORTA LA RESPUESTA CORRECTA" align="center" position="0 .42 .05" width="6.5" color="#2ecc71" font="exo2bold"></a-text>
    <a-text id="explanation-text" value="" align="center" position="0 .13 .05" width="5.7" color="#d8e7ea" wrap-count="58"></a-text>
    <a-text id="lives-text" value="VIDAS: 3" align="center" position="0 -.35 .05" width="5.5"></a-text>
    <a-text id="score-text" value="PUNTOS: 0" align="center" position="-1.75 -.75 .05" width="4.4" color="#f1c40f"></a-text>
    <a-text id="combo-text" value="RACHA: 0" align="center" position="1.75 -.75 .05" width="4.4" color="#f1c40f"></a-text>
    <a-entity id="start-btn" class="interactuable" position="0 -1.3 .12" geometry="primitive:plane;width:3.2;height:.65" material="color:#168a63;emissive:#168a63;emissiveIntensity:.35">
      <a-text value="INICIAR ENTRENAMIENTO" align="center" position="0 0 .02" width="6.7" color="#fff" font="exo2bold"></a-text>
    </a-entity>
  </a-entity>

  <a-entity id="status" position="-3.25 2.35 -3.8">
    <a-text id="category-text" value="BLOQUE: SEGURIDAD" width="3.5" color="#83d5e8"></a-text>
  </a-entity>
</a-scene>

<script>
window.addEventListener('load', () => {
  const DESAFIOS = [
    {q:'Protección de ojos',a:'Pantalla homologada',bad:'Gafas de sol',cat:'Seguridad',ex:'La pantalla protege frente a radiación, proyecciones y luz intensa del arco.'},
    {q:'Antes de soldar',a:'Ventilar y revisar el equipo',bad:'Trabajar sin comprobar cables',cat:'Seguridad',ex:'La ventilación y la revisión de cables, pinza y masa reducen riesgos eléctricos y de humos.'},
    {q:'Humo de soldadura',a:'Usar extracción localizada',bad:'Respirar cerca del arco',cat:'Seguridad',ex:'La extracción localizada evita que el humo entre en la zona de respiración.'},
    {q:'SMAW',a:'111',bad:'141',cat:'Proceso',ex:'SMAW es la soldadura manual con electrodo revestido y corresponde al proceso 111.'},
    {q:'SMAW (modo)',a:'Manual',bad:'Automático',cat:'Proceso',ex:'El avance del electrodo lo realiza el soldador de forma manual.'},
    {q:'SAN',a:'Atmósfera natural',bad:'Atmósfera protegida',cat:'Proceso',ex:'En SMAW el revestimiento genera gases y escoria, pero el arco trabaja en atmósfera natural.'},
    {q:'Polaridad directa',a:'CC−',bad:'CC+',cat:'Electricidad',ex:'En polaridad directa el electrodo queda conectado al polo negativo.'},
    {q:'Polaridad inversa',a:'CC+',bad:'CC−',cat:'Electricidad',ex:'En polaridad inversa el electrodo queda conectado al polo positivo.'},
    {q:'Corriente alterna',a:'CA (~)',bad:'CC (=)',cat:'Electricidad',ex:'La corriente alterna cambia de sentido periódicamente y se representa como CA o ~.'},
    {q:'Tensión (V)',a:'Voltio (V)',bad:'Ohmio (Ω)',cat:'Electricidad',ex:'El voltio mide la tensión eléctrica; el ohmio mide la resistencia.'},
    {q:'Intensidad (I)',a:'Amperio (A)',bad:'Voltio (V)',cat:'Electricidad',ex:'La intensidad de corriente se expresa en amperios.'},
    {q:'E6013',a:'Rutilo',bad:'Básico',cat:'Electrodos',ex:'El E6013 es un electrodo revestido de tipo rutilo, de uso muy extendido.'},
    {q:'E7016',a:'Básico',bad:'Rutilo',cat:'Electrodos',ex:'El E7016 pertenece a la familia de electrodos básicos y exige buen control de humedad.'},
    {q:'Hidrógeno',a:'Grietas',bad:'Poros',cat:'Defectos',ex:'El hidrógeno difusible puede favorecer grietas, especialmente en condiciones desfavorables.'},
    {q:'Soplo magnético',a:'Desviación del arco',bad:'Porosidad',cat:'Defectos',ex:'El soplo magnético desvía el arco por efectos del campo magnético.'},
    {q:'Zona afectada térmicamente',a:'ZAT',bad:'TAZ',cat:'Metalurgia',ex:'La abreviatura habitual en español es ZAT: zona afectada térmicamente.'},
    {q:'Acero',a:'Menos de 1,7 % de C',bad:'Entre 1,7 % y 6,7 % de C',cat:'Materiales',ex:'En esta clasificación didáctica, el acero contiene menos de 1,7 % de carbono.'},
    {q:'Acero (composición)',a:'Fe + C',bad:'Fe + O',cat:'Materiales',ex:'El acero es una aleación basada principalmente en hierro y carbono.'},
    {q:'Ley de Ohm',a:'V = R × I',bad:'V = R / I',cat:'Electricidad',ex:'La tensión se obtiene multiplicando resistencia por intensidad: V = R × I.'}
  ];

  let score=0, combo=0, lives=3, answered=0, active=false, current=null, duration=8200, timer=null, locked=false;
  const $ = id => document.querySelector(id);
  const scene = $('a-scene'), start = $('#start-btn'), startLabel = start.querySelector('a-text');
  const blades = document.querySelectorAll('.saber-blade');

  AFRAME.registerComponent('game-engine', {
    init() {
      this.el.addEventListener('raycaster-intersection', e => {
        (e.detail.els || []).forEach(target => {
          if (!active || locked) return;
          if (target.classList.contains('target-item')) {
            const hit = e.detail.intersections && e.detail.intersections[0];
            this.handleHit(target, hit ? hit.point : target.object3D.position);
          } else if (!active && target.id === 'start-btn') this.startGame();
        });
      });
      start.addEventListener('click', () => { if (!active) this.startGame(); });
      this.showIntro();
    },
    showIntro() {
      $('#hint-text').setAttribute('value','REVISA EL EQUIPO Y CORTA LA RESPUESTA CORRECTA');
      $('#explanation-text').setAttribute('value','19 retos | 3 bloques | evaluación final');
      $('#category-text').setAttribute('value','BLOQUE: SEGURIDAD');
      start.setAttribute('visible','true'); start.setAttribute('scale','1 1 1');
      startLabel.setAttribute('value','INICIAR ENTRENAMIENTO');
    },
    startGame() {
      active=true; locked=false; score=0; combo=0; lives=3; answered=0; duration=8200;
      this.clearTargets(); this.setBlades('#f1c40f',5); this.updateUI();
      start.setAttribute('visible','false'); start.setAttribute('scale','0 0 0');
      this.nextChallenge();
    },
    nextChallenge() {
      if (!active) return;
      locked=false; clearTimeout(timer);
      let next; do next=DESAFIOS[Math.floor(Math.random()*DESAFIOS.length)]; while(next===current && DESAFIOS.length>1);
      current=next;
      const level=answered<6?'1':answered<13?'2':'3';
      $('#level-text').setAttribute('value',`NIVEL ${level} | ${current.cat.toUpperCase()}`);
      $('#category-text').setAttribute('value',`BLOQUE: ${current.cat.toUpperCase()}`);
      $('#hint-text').setAttribute('value',current.q); $('#hint-text').setAttribute('color','#2ecc71');
      $('#explanation-text').setAttribute('value',''); this.spawnTargets();
    },
    spawnTargets() {
      const left=Math.random()>.5;
      this.createTarget(current.a,left?-1.25:1.25,true);
      this.createTarget(current.bad,left?1.25:-1.25,false);
    },
    createTarget(label,x,correct) {
      const target=document.createElement('a-entity'); target.classList.add('target-item'); target.dataset.correct=correct?'true':'false';
      target.setAttribute('position',`${x} 1.35 -18`); target.setAttribute('geometry','primitive:circle;radius:.52');
      target.setAttribute('material','color:#111923;metalness:.75;roughness:.2;emissive:#f1c40f;emissiveIntensity:.12');
      const text=document.createElement('a-text'); text.setAttribute('value',label); text.setAttribute('align','center'); text.setAttribute('position','0 0 .025'); text.setAttribute('width','5.2'); text.setAttribute('color','#f7d774'); text.setAttribute('font','exo2bold'); text.setAttribute('wrap-count','20');
      target.appendChild(text); scene.appendChild(target);
      target.setAttribute('animation__move',{property:'position',to:`${x} 1.35 -.75`,dur:duration,easing:'linear'});
      setTimeout(()=>{ if(target.parentNode) target.parentNode.removeChild(target); if(correct && active && !locked) this.miss(); },duration+80);
    },
    handleHit(target,point) {
      if(locked || !target.parentNode) return; locked=true;
      const correct=target.dataset.correct==='true'; this.sparks(point);
      if(correct){ score+=10+combo*2; combo++; answered++; this.explain(true); this.slice(target); this.increaseSpeed(); this.updateUI();
        if(answered>=DESAFIOS.length) setTimeout(()=>this.victory(),950); else setTimeout(()=>this.nextChallenge(),950);
      } else { this.explain(false); lives--; combo=0; this.updateUI(); if(lives<=0) setTimeout(()=>this.gameOver(),850); else setTimeout(()=>this.nextChallenge(),1450); }
    },
    miss(){ if(locked || !active) return; locked=true; lives--; combo=0; $('#hint-text').setAttribute('value','FUERA DE TIEMPO'); $('#hint-text').setAttribute('color','#e74c3c'); $('#explanation-text').setAttribute('value',current.ex); this.updateUI(); if(lives<=0)setTimeout(()=>this.gameOver(),900); else setTimeout(()=>this.nextChallenge(),1450); },
    explain(ok){ $('#hint-text').setAttribute('value',ok?'CORRECTO':'RESPUESTA INCORRECTA'); $('#hint-text').setAttribute('color',ok?'#2ecc71':'#e74c3c'); $('#explanation-text').setAttribute('value',current.ex); },
    increaseSpeed(){ duration=Math.max(3300,duration-220); },
    updateUI(){ $('#score-text').setAttribute('value',`PUNTOS: ${score}`); $('#combo-text').setAttribute('value',`RACHA: ${combo}`); $('#lives-text').setAttribute('value',`VIDAS: ${'♥'.repeat(Math.max(0,lives))}`); $('#lives-text').setAttribute('color',lives===1?'#e74c3c':'#fff'); const p=answered/DESAFIOS.length; $('#progress-bar').setAttribute('width',5.4*p); $('#progress-bar').setAttribute('position',`${-2.7+2.7*p} .82 .07`); },
    clearTargets(){ document.querySelectorAll('.target-item').forEach(t=>t.remove()); },
    setBlades(color,intensity){ blades.forEach(b=>b.setAttribute('material',{color,emissive:color,emissiveIntensity:intensity})); document.querySelectorAll('a-light[type="point"]').forEach(l=>l.setAttribute('color',color)); },
    sparks(pos){ for(let i=0;i<10;i++){const s=document.createElement('a-sphere'); s.setAttribute('radius','.018'); s.setAttribute('position',`${pos.x} ${pos.y} ${pos.z}`); s.setAttribute('material','color:#f1c40f;shader:flat;emissive:#f1c40f;emissiveIntensity:4'); s.setAttribute('animation__move',{property:'position',to:`${pos.x+(Math.random()-.5)*2} ${pos.y+Math.random()*1.5} ${pos.z+(Math.random()-.5)}`,dur:450}); s.setAttribute('animation__fade',{property:'scale',to:'0 0 0',dur:450}); scene.appendChild(s); setTimeout(()=>s.remove(),500); } },
    slice(target){ target.remove(); this.clearTargets(); },
    finish(title,color){ active=false; locked=true; clearTimeout(timer); this.clearTargets(); $('#hint-text').setAttribute('value',title); $('#hint-text').setAttribute('color',color); $('#explanation-text').setAttribute('value',`Resultado: ${score} puntos | ${answered}/${DESAFIOS.length} aciertos | ${Math.round(answered/DESAFIOS.length*100)} %`); start.setAttribute('visible','true'); start.setAttribute('scale','1 1 1'); startLabel.setAttribute('value','REPETIR ENTRENAMIENTO'); },
    victory(){ this.setBlades('#2ecc71',7); this.finish('ENTRENAMIENTO SUPERADO','#2ecc71'); },
    gameOver(){ this.setBlades('#e74c3c',5); this.finish('ENTRENAMIENTO NO SUPERADO','#e74c3c'); }
  });
});
</script>
</body>
</html>
